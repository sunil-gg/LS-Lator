<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LS-LATOR</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    overflow:hidden;

    background:
    radial-gradient(circle at top left,#2563eb 0%,transparent 35%),
    radial-gradient(circle at bottom right,#9333ea 0%,transparent 35%),
    linear-gradient(135deg,#020617,#0f172a);

    font-family:'Inter',sans-serif;
}

/* Floating Liquid Orbs */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.55;
    animation:float 12s infinite alternate ease-in-out;
}

.orb1{
    width:300px;
    height:300px;
    background:#3b82f6;
    top:-100px;
    left:-100px;
}

.orb2{
    width:320px;
    height:320px;
    background:#9333ea;
    bottom:-120px;
    right:-120px;
    animation-delay:4s;
}

@keyframes float{
    from{
        transform:translate(0,0) scale(1);
    }

    to{
        transform:translate(80px,50px) scale(1.2);
    }
}

/* Tiny Floating Particles */

.particles{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.particles span{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:rgba(255,255,255,0.7);

    animation:particleMove linear infinite;
}

.particles span:nth-child(1){left:10%;animation-duration:12s;}
.particles span:nth-child(2){left:20%;animation-duration:15s;}
.particles span:nth-child(3){left:30%;animation-duration:18s;}
.particles span:nth-child(4){left:40%;animation-duration:11s;}
.particles span:nth-child(5){left:50%;animation-duration:16s;}
.particles span:nth-child(6){left:60%;animation-duration:13s;}
.particles span:nth-child(7){left:70%;animation-duration:20s;}
.particles span:nth-child(8){left:80%;animation-duration:14s;}
.particles span:nth-child(9){left:90%;animation-duration:17s;}
.particles span:nth-child(10){left:95%;animation-duration:19s;}

@keyframes particleMove{
    from{
        transform:translateY(100vh) scale(1);
        opacity:0;
    }

    20%{
        opacity:0.5;
    }

    to{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
    }
}

/* Liquid Glass Calculator */

.calculator{

    position:relative;

    width:390px;

    padding:28px;

    border-radius:38px;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,0.18),
        rgba(255,255,255,0.05)
    );

    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);

    border:1px solid rgba(255,255,255,0.18);

    box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 1px 1px rgba(255,255,255,0.3),
        inset 0 -1px 1px rgba(255,255,255,0.08);

    overflow:hidden;

    z-index:2;

    animation:fadeIn 1s ease;
}

/* Top Liquid Reflection */

.calculator::before{
    content:'';

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:45%;

    background:linear-gradient(
        to bottom,
        rgba(255,255,255,0.22),
        transparent
    );

    pointer-events:none;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px) scale(0.92);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Header */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:25px;

    position:relative;
    z-index:2;
}

.logo{
    font-family:'Orbitron',sans-serif;

    color:white;

    font-size:1.4rem;

    letter-spacing:3px;

    text-shadow:
        0 0 10px rgba(255,255,255,0.5),
        0 0 25px rgba(59,130,246,0.7);
}

.live-dot{
    width:12px;
    height:12px;

    border-radius:50%;

    background:#22c55e;

    box-shadow:0 0 12px #22c55e;

    animation:pulse 1.8s infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.5);
        opacity:0.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* Display */

.display{

    width:100%;
    height:100px;

    border:none;
    outline:none;

    border-radius:28px;

    padding:22px;

    text-align:right;

    color:white;

    font-size:2.2rem;

    font-family:'Orbitron',sans-serif;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,0.08),
        inset 0 -2px 6px rgba(0,0,0,0.25);

    margin-bottom:24px;
}

/* Buttons */

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

button{

    position:relative;

    height:72px;

    border:none;

    border-radius:24px;

    color:white;

    font-size:1.1rem;
    font-weight:500;

    cursor:pointer;

    overflow:hidden;

    background:rgba(255,255,255,0.09);

    backdrop-filter:blur(14px);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.15),
        inset 0 -1px 1px rgba(255,255,255,0.04),
        0 5px 18px rgba(0,0,0,0.18);

    transition:0.22s ease;
}

/* Liquid Shine */

button::before{

    content:'';

    position:absolute;

    top:0;
    left:-120%;

    width:60%;
    height:100%;

    transform:skewX(-25deg);

    background:linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,0.45),
        transparent
    );

    transition:0.6s;
}

button:hover::before{
    left:150%;
}

button:hover{

    transform:translateY(-4px) scale(1.03);

    background:rgba(255,255,255,0.14);
}

button:active{
    transform:scale(0.96);
}

/* Special Buttons */

.operator{
    background:rgba(59,130,246,0.28);
}

.equal{
    grid-column:span 2;
    background:rgba(20,184,166,0.35);
}

.clear{
    background:rgba(239,68,68,0.32);
}

.backspace{
    background:rgba(245,158,11,0.32);
}

/* Credit */

.credit{

    margin-top:20px;

    color:rgba(255,255,255,0.72);

    font-size:0.95rem;

    letter-spacing:1px;

    z-index:2;
}

.credit span{

    color:white;

    font-weight:600;

    text-shadow:
        0 0 10px rgba(59,130,246,0.6),
        0 0 20px rgba(147,51,234,0.6);
}

/* Mobile */

@media(max-width:430px){

    .calculator{
        width:95%;
        padding:22px;
    }

    button{
        height:66px;
    }

    .display{
        font-size:1.8rem;
    }
}

</style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="calculator">

    <div class="header">
        <div class="logo">⚡ LS-LATOR</div>
        <div class="live-dot"></div>
    </div>

    <input type="text" id="display" class="display" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="backspace" onclick="backspace()">⌫</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>

        <button class="equal" onclick="calculate()">=</button>

    </div>

</div>

<div class="credit">
    Created by <span>LS Titan</span>
</div>

<script>

const display = document.getElementById("display");

/* Add Value */

function appendValue(value){

    if(display.value === "Error"){
        display.value = "";
    }

    display.value += value;
}

/* Clear */

function clearDisplay(){
    display.value = "";
}

/* Backspace */

function backspace(){
    display.value = display.value.slice(0,-1);
}

/* Calculate */

function calculate(){

    try{

        if(display.value.trim() === ""){
            return;
        }

        let result = eval(display.value);

        result = parseFloat(Number(result).toPrecision(12));

        display.value = result;

        animateDisplay();

    }catch{

        display.value = "Error";

        shakeCalculator();
    }
}

/* Keyboard Support */

document.addEventListener("keydown", function(event){

    const key = event.key;

    if(!isNaN(key) || ['+','-','*','/','.','%'].includes(key)){

        appendValue(key);
    }

    else if(key === "Enter"){

        calculate();
    }

    else if(key === "Backspace"){

        backspace();
    }

    else if(key === "Escape"){

        clearDisplay();
    }
});

/* Display Animation */

function animateDisplay(){

    display.animate([
        { transform:'scale(1)' },
        { transform:'scale(1.05)' },
        { transform:'scale(1)' }
    ],{
        duration:260
    });
}

/* Error Animation */

function shakeCalculator(){

    document.querySelector('.calculator').animate([
        { transform:'translateX(0)' },
        { transform:'translateX(-8px)' },
        { transform:'translateX(8px)' },
        { transform:'translateX(0)' }
    ],{
        duration:300
    });
}

</script>

</body>
</html>
